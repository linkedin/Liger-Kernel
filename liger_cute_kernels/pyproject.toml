# Build config for the independent lck wheel (see setup.py).
# Build with --no-build-isolation so it uses the configured CUDA toolkit; the
# `requires` below document what that environment must already provide.
[build-system]
requires = [
    "setuptools>=70.1",
    "wheel",
    "pybind11>=2.11",
    "cmake>=3.24",
    "ninja",
    "apache-tvm-ffi",
]
build-backend = "setuptools.build_meta"
